<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SmartSkin AI — Your skin profile</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="commun/base.css">
  <style>
/* ═══ 19-questions — le questionnaire du scan visage (7 étapes) ═══
   PORT de la V1 : src/components/screens/QuestionScreen.tsx + questions-glass.css
   + les règles de layout utiles de funnel.css (.opt, .list, .topbar, .footer).
   Les deux feuilles V1 sont ici FUSIONNÉES (qglass gagnait dans la cascade V1)
   et scopées sous `.qg` ; les tokens (--ink, --cloud, --graphite…) viennent de
   base.css. Le fond + les orbes viennent de `.phone` (base.css), pas de
   `.qglass::before` : dans le proto c'est le cadre téléphone qui les porte. */

.qg {
  --glass:rgba(255,255,255,0.46); --glass-hi:rgba(255,255,255,0.66);
  --gline:rgba(255,255,255,0.7); --sheen:inset 0 1px 0 rgba(255,255,255,0.75);
  --blur:blur(18px) saturate(165%);
  /* layout de la V1 (.screen) : hauteur figée, seule la liste défile, pied ancré.
     Sur ≥480px le proto affiche une carte téléphone → on garde le format 430×932
     des maquettes, plafonné au viewport. */
  display:flex; flex-direction:column; height:100dvh;
}
@media (min-width:480px) { .qg { height:932px; max-height:calc(100dvh - 120px); } }

/* ── brand (logo centré, comme tous les écrans du tunnel V1) ── */
.qg .brand { display:flex; align-items:center; justify-content:center;
  padding:max(30px, calc(env(safe-area-inset-top) + 12px)) 24px 0;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both .02s; }
.qg .brand img { height:29px; width:auto; display:block; }

/* ── topbar : retour + progression en verre ── */
.qg .topbar { padding:20px 24px 0; display:flex; align-items:center; gap:14px;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both .05s; }
.qg .back { width:40px; height:40px; border-radius:50%; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--ink);
  background:var(--glass); -webkit-backdrop-filter:blur(12px) saturate(160%); backdrop-filter:blur(12px) saturate(160%);
  border:1px solid var(--gline); box-shadow:var(--sheen), 0 4px 12px rgba(40,55,75,0.10); }
.qg .back:focus-visible { outline:2px solid var(--blue-d); outline-offset:2px; }
.qg .prog { flex:1; height:5px; border-radius:100px; overflow:hidden;
  background:rgba(255,255,255,0.4); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.55); box-shadow:inset 0 1px 2px rgba(40,55,75,0.06); }
.qg .prog-fill { height:100%; width:var(--pw); border-radius:100px;
  background:linear-gradient(90deg, var(--blue-d), #40424D);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.35);
  animation:grow .9s cubic-bezier(.22,1,.36,1) both .2s; }
@keyframes grow { from { width:0; } to { width:var(--pw); } }
.qg .prog-step { font-family:var(--fm); font-size:10px; color:var(--graphite); letter-spacing:0.08em; flex-shrink:0; }

/* ── pastille « produit en attente » : le fil du scan pendant le tunnel (fork v2, 30/08).
   Parcours produit seulement — depuis le dashboard il n'y a pas de produit, elle est absente. ── */
.qg .attente { display:none; align-items:center; gap:8px; margin:12px 24px 0; padding:6px 13px 6px 6px;
  width:fit-content; max-width:calc(100% - 48px); border-radius:100px;
  background:var(--glass); -webkit-backdrop-filter:blur(12px) saturate(160%); backdrop-filter:blur(12px) saturate(160%);
  border:1px solid var(--gline); box-shadow:var(--sheen), 0 4px 12px rgba(40,55,75,0.08);
  animation:rise .5s cubic-bezier(.22,1,.36,1) both .08s; }
.qg .attente.on { display:flex; }
.qg .attente img { width:26px; height:26px; border-radius:50%; object-fit:contain; background:#fff; padding:2px; flex-shrink:0; }
.qg .attente span { font-size:10.5px; font-weight:600; letter-spacing:-0.01em; color:var(--graphite);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qg .attente span b { color:var(--ink); font-weight:800; }

/* ── en-tête de question ── */
.qg .qhead { padding:26px 26px 14px; }
.qg .question { font-weight:800; font-size:28px; line-height:1.1; letter-spacing:-0.035em; color:var(--ink); }
.qg .helper { font-weight:400; font-size:12.5px; color:var(--graphite); margin-top:11px; line-height:1.4; }
.qg .helper svg { color:var(--graphite); vertical-align:-2px; margin-right:6px; }
.qg .helper b { color:var(--ink); font-weight:700; }

/* ── liste : colonne par défaut, grille 2 col. pour `age` et q1 ── */
.qg .list { flex:1; min-height:0; overflow-y:auto; scrollbar-width:none;
  padding:6px 22px 12px; display:flex; flex-direction:column; gap:10px; }
.qg .list::-webkit-scrollbar { display:none; }
.qg .list.grid2 { padding:4px 22px 12px; display:grid; grid-template-columns:1fr 1fr; gap:9px; align-content:start; }

/* ── option : carte en verre dépoli ── */
.qg .opt {
  position:relative; display:flex; flex-direction:row; align-items:center; gap:14px;
  padding:14px 46px 14px 14px; border-radius:18px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  font:inherit; text-align:left; color:inherit; flex-shrink:0;
  background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid var(--gline); box-shadow:0 8px 22px rgba(40,55,75,0.10), var(--sheen);
  transition:background .24s, border-color .24s, transform .15s, box-shadow .24s, opacity .22s;
  /* backwards (pas both) : `both` retiendrait opacity:1 et bloquerait .dim */
  animation:rise .5s cubic-bezier(.22,1,.36,1) backwards;
}
.qg .opt:hover { background:var(--glass-hi); box-shadow:0 12px 28px rgba(40,55,75,0.14), inset 0 1px 0 rgba(255,255,255,0.85); }
.qg .opt:active { transform:scale(0.99); }
.qg .opt:focus-visible { outline:2px solid var(--blue-d); outline-offset:2px; }
.qg .grid2 .opt { flex-direction:column; align-items:flex-start; gap:11px; padding:14px 14px 15px; }
.qg .grid2 .opt:active { transform:scale(0.985); }

.qg .opt-ic { width:46px; height:46px; border-radius:13px; flex-shrink:0;
  background:rgba(255,255,255,0.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.6); box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);
  display:flex; align-items:center; justify-content:center; color:var(--graphite);
  transition:background .24s, color .24s, box-shadow .24s, border-color .24s; }
.qg .opt-tx { min-width:0; display:block; }
.qg .opt-l { display:block; font-weight:700; font-size:15px; color:var(--ink); letter-spacing:-0.025em; line-height:1.12; }
.qg .opt-s { display:block; font-size:11.5px; color:var(--space); margin-top:3px; line-height:1.25; }
.qg .grid2 .opt-l { font-size:14.5px; }
.qg .grid2 .opt-s { font-size:11px; }

.qg .opt-radio { position:absolute; top:50%; right:14px; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%;
  border:1.5px solid rgba(110,154,182,0.4); background:rgba(255,255,255,0.4); box-shadow:var(--sheen);
  display:flex; align-items:center; justify-content:center; color:transparent;
  transition:all .22s cubic-bezier(.34,1.56,.64,1); }
.qg .grid2 .opt-radio { top:13px; right:13px; transform:none; }

/* état sélectionné */
.qg .opt.sel { background:rgba(166,195,214,0.30); border-color:rgba(166,195,214,0.85);
  box-shadow:0 14px 30px rgba(110,154,182,0.30), inset 0 1px 0 rgba(255,255,255,0.7); }
.qg .opt.sel .opt-ic { background:linear-gradient(160deg, #B7CFDF, var(--blue-d)); border-color:rgba(255,255,255,0.55);
  color:#fff; box-shadow:0 6px 14px rgba(110,154,182,0.30), inset 0 1px 0 rgba(255,255,255,0.5); }
.qg .opt.sel .opt-s { color:var(--graphite); }
.qg .opt.sel .opt-radio { background:linear-gradient(160deg, #B7CFDF, var(--blue-d)); border-color:transparent; color:#fff;
  box-shadow:0 3px 8px rgba(110,154,182,0.30), inset 0 1px 0 rgba(255,255,255,0.5); transform:translateY(-50%) scale(1.06); }
.qg .grid2 .opt.sel .opt-radio { transform:scale(1.06); }
.qg .opt.dim { opacity:0.42; pointer-events:none; }

/* q5 : gate (pastille carrée) + sous-bloc révélé */
.qg .opt.gate .opt-radio { border-radius:8px; }
.qg .reveal { display:flex; flex-direction:column; gap:10px; overflow:hidden; max-height:0; opacity:0; flex-shrink:0;
  transform:translateY(-4px);
  transition:max-height .42s cubic-bezier(.22,1,.36,1), opacity .3s ease, transform .42s cubic-bezier(.22,1,.36,1); }
.qg .reveal.open { max-height:1400px; opacity:1; transform:none; }
.qg .sub { font-family:var(--fm); font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--graphite);
  padding:8px 4px 2px; display:flex; align-items:center; gap:8px; }
.qg .sub::before { content:""; flex:0 0 18px; height:1px; background:rgba(110,154,182,0.4); }

/* ── pied : compteur + CTA sombre, ancré sous la liste (comme la V1) ── */
.qg .footer { flex-shrink:0;
  padding:14px 22px calc(env(safe-area-inset-bottom) + 26px);
  background:linear-gradient(to top, #E5EAF1 62%, rgba(229,234,241,0)); }
.qg .foot-row { display:flex; align-items:center; gap:14px; }
.qg .counter { font-family:var(--fm); font-size:10px; color:var(--graphite); letter-spacing:0.05em; white-space:nowrap; }
.qg .counter b { color:var(--ink); font-weight:500; }
.qg .cta-btn { flex:1; width:auto; height:56px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); cursor:pointer;
  background:linear-gradient(180deg, #2A2D34 0%, #1A1D21 100%); color:#fff;
  font-family:var(--fd); font-weight:600; font-size:15px; letter-spacing:-0.01em;
  display:flex; align-items:center; justify-content:center; gap:9px;
  box-shadow:0 8px 20px rgba(26,29,33,0.26), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:opacity .2s, transform .18s, box-shadow .2s; }
.qg .cta-btn:disabled { opacity:0.34; box-shadow:none; cursor:not-allowed; transform:none; }
.qg .cta-btn:not(:disabled):hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(26,29,33,0.30), inset 0 1px 0 rgba(255,255,255,0.28); }
.qg .cta-btn svg { transition:transform .2s; }
.qg .cta-btn:not(:disabled):hover svg { transform:translateX(3px); }

/* rejouée à chaque changement d'étape (la V1 remontait la route) */
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.qg .rise { animation:rise .55s cubic-bezier(.22,1,.36,1) both var(--d, 0s); }
@media (prefers-reduced-motion: reduce) {
  .qg .brand, .qg .topbar, .qg .rise, .qg .opt, .qg .prog-fill { animation:none; }
}
  </style>
</head>

<div class="phone qg">
  <div class="brand"><img src="logo.png" alt="SmartSkin AI"></div>

  <div class="topbar">
    <button type="button" class="back" id="q-back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13L5 8l5-5"></path></svg></button>
    <div class="prog" id="q-prog" role="progressbar" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" aria-label="Step 1 of 7"></div>
    <span class="prog-step" id="q-step"></span>
  </div>

  <div class="attente" id="q-attente">
    <img id="q-attente-img" src="" alt="" style="display:none">
    <span><b id="q-attente-nom"></b>&nbsp;&mdash; waiting for its verdict</span>

  <div class="qhead" id="q-head"></div>
  <div class="list" id="q-list"></div>

  <div class="footer" id="q-footer">
    <div class="foot-row">
      <span class="counter" id="q-counter" style="display:none"></span>
      <button type="button" class="cta-btn" id="q-cta" disabled></button>
    </div>
  </div>
</div>

<script src="commun/app.js"></script>

  /* STEP_ORDER de la V1 : q6 (budget) retiré → 7 étapes. */
  var ORDRE = ["age", "q1", "q2", "q3", "q4", "q5", "q7"];
  var TOTAL = ORDRE.length;
  var CLE = "ss-visage-answers";
  var SUIVANT = "20-capture.html";

  var HELPER_IC = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M7 9.5V6.5M7 4.6v.05" stroke-linecap="round"/></svg>';
  var ARROW_IC = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ═══ ÉTAT ═══ forme exacte d'`Answers` (src/features/funnel/types.ts) ═══ */
  function vide() {
    return { age: null, q1: [], q2: [], q3: [], q4: null, q5: { changed: null, symptoms: [] }, q6: null, q7: [] };
  }

  var rep = vide();
  var iEtape = 0;

  /* ═══ VALIDATION — port de src/features/funnel/validation.ts ═══ */

  // valeurs exclusives connues, toutes questions confondues (comme la V1)
  var EXCLUSIVES = (function () {
    var set = {}, k, i, opts;
    for (k in QUESTIONS) {
      if (!Object.prototype.hasOwnProperty.call(QUESTIONS, k)) continue;
      opts = QUESTIONS[k].options.concat(QUESTIONS[k].revealOptions || []);
      for (i = 0; i < opts.length; i++) { if (opts[i].exclusive) set[opts[i].value] = true; }
    }
    return set;
  })();

  /** Bascule une valeur dans une sélection multi (exclusivité + maximum).
   *  - cocher une option exclusive → la sélection ne contient plus qu'elle
   *  - cocher une option normale → retire toute exclusive posée
   *  - max atteint (q1 : 3) → une option de plus est ignorée (décocher reste possible) */
  function basculer(courant, valeur, estExclusive, max) {
    if (courant.indexOf(valeur) !== -1) {
      return courant.filter(function (v) { return v !== valeur; });
    }
    if (estExclusive) return [valeur];
    var nettoye = courant.filter(function (v) { return !EXCLUSIVES[v]; });
    if (max !== undefined && nettoye.length >= max) return courant;
    nettoye = nettoye.slice();
    nettoye.push(valeur);
    return nettoye;
  }

  function etapeValide(step, a) {
    if (step === "age") return a.age !== null;
    if (step === "q1") return a.q1.length > 0;
    if (step === "q2") return a.q2.length > 0;
    if (step === "q3") return a.q3.length > 0;
    if (step === "q4") return a.q4 !== null;
    if (step === "q5") {
      if (a.q5.changed === false) return true;
      if (a.q5.changed === true) return a.q5.symptoms.length > 0;
      return false;
    }
    if (step === "q6") return a.q6 !== null;
    if (step === "q7") return a.q7.length > 0;
    return false;
  }

  /* ═══ STOCKAGE ═══
     Contrat : à la fin, `ss-visage-answers` (session) contient un `Answers`.
     On écrit aussi à CHAQUE réponse — sans quoi la reprise après rechargement
     demandée par le lot n'aurait rien à reprendre. */
  function sauver() {
    try { sessionStorage.setItem(CLE, JSON.stringify(rep)); } catch (e) {}
  }
  function charger() {
    var brut = null, o;
    try { brut = sessionStorage.getItem(CLE); } catch (e) {}
    if (!brut) return false;
    try { o = JSON.parse(brut); } catch (e) { return false; }
    if (!o || typeof o !== "object") return false;
    var a = vide();
    if (typeof o.age === "string") a.age = o.age;
    if (typeof o.q4 === "string") a.q4 = o.q4;
    if (typeof o.q6 === "string") a.q6 = o.q6;
    ["q1", "q2", "q3", "q7"].forEach(function (k) {
      if (Object.prototype.toString.call(o[k]) === "[object Array]") a[k] = o[k].slice();
    });
    if (o.q5 && typeof o.q5 === "object") {
      if (o.q5.changed === true || o.q5.changed === false) a.q5.changed = o.q5.changed;
      if (Object.prototype.toString.call(o.q5.symptoms) === "[object Array]") a.q5.symptoms = o.q5.symptoms.slice();
    }
    rep = a;
    return true;
  }
  /** Reprise : la 1ʳᵉ étape encore invalide (on ne peut pas avoir dépassé une
   *  étape invalide). Tout valide → la dernière, prête à être relancée. */
  function etapeReprise() {
    var i;
    for (i = 0; i < TOTAL; i++) { if (!etapeValide(ORDRE[i], rep)) return i; }
    return TOTAL - 1;
  }

  /* ═══ RENDU ═══ */
  /* Pastille produit : paquet {nom, image} posé par la fourche (ss-produit-attente). */
  try {
    var attente = JSON.parse(sessionStorage.getItem("ss-produit-attente") || "null");
    if (attente && attente.nom) {
      document.getElementById("q-attente-nom").textContent = attente.nom;
      if (attente.image) {
        var attImg = document.getElementById("q-attente-img");
        attImg.src = attente.image;
        attImg.style.display = "block";
      }
      document.getElementById("q-attente").className = "attente on";
    }
  } catch (e) {}

  var elHead = document.getElementById("q-head");
  var elList = document.getElementById("q-list");
  var elFooter = document.getElementById("q-footer");
  var elProg = document.getElementById("q-prog");
  var elStep = document.getElementById("q-step");
  var elCta = document.getElementById("q-cta");
  var elCounter = document.getElementById("q-counter");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function rejouer(el, delai) {
    el.classList.remove("rise");
    void el.offsetWidth;              // reflow : relance l'animation
    el.style.setProperty("--d", delai);
    el.classList.add("rise");
  }

  function selectionMulti(step) {
    var q = QUESTIONS[step];
    if (q.mode === "multi") return rep[step];
    return [];
  }

  /** q1 : options grisées (maquette) — exclusive posée, ou max atteint. */
  function grisees(q, choisies) {
    if (q.mode !== "multi" || q.maxSelect === undefined) return {};
    var exclusivePosee = false, i, o, out = {};
    for (i = 0; i < q.options.length; i++) {
      o = q.options[i];
      if (o.exclusive && choisies.indexOf(o.value) !== -1) { exclusivePosee = true; break; }
    }
    for (i = 0; i < q.options.length; i++) {
      o = q.options[i];
      var estChoisie = choisies.indexOf(o.value) !== -1;
      if (exclusivePosee && !o.exclusive) out[o.value] = true;
      else if (!exclusivePosee && o.exclusive && choisies.length > 0) out[o.value] = true;
      else if (!exclusivePosee && !estChoisie && choisies.length >= q.maxSelect) out[o.value] = true;
    }
    return out;
  }

  function htmlOption(o, sel, dim, gate, delai, sym) {
    var cls = "opt" + (gate ? " gate" : "") + (sel ? " sel" : "") + (dim ? " dim" : "") + (o.badge ? " featured" : "");
    var h = '<button type="button" class="' + cls + '" data-v="' + esc(o.value) + '"'
          + (sym ? ' data-sym="1"' : "")
          + ' aria-pressed="' + (sel ? "true" : "false") + '"'
          + (delai === null ? "" : ' style="animation-delay:' + delai + 's"') + '>';
    if (o.icon) h += '<span class="opt-ic" aria-hidden="true">' + o.icon + '</span>';
    h += '<span class="opt-tx"><span class="opt-l">' + esc(o.label)
       + (o.badge ? '<span class="opt-badge">' + esc(o.badge) + '</span>' : "")
       + '</span>';
    if (o.sub) h += '<span class="opt-s">' + esc(o.sub) + '</span>';
    h += '</span><span class="opt-radio" aria-hidden="true">' + CHECK + '</span></button>';
    return h;
  }

  /** Rend la liste d'options. `reconstruire` = changement d'étape ; sinon on met
   *  à jour les classes en place (reconstruire rejouerait l'animation `rise`). */
  function rendreListe(reconstruire) {
    var step = ORDRE[iEtape];
    var q = QUESTIONS[step];
    var choisies, dim, html = "", i;

    if (q.mode === "age") choisies = rep.age ? [rep.age] : [];
    else if (q.mode === "single") choisies = rep[step] ? [rep[step]] : [];
    else if (q.mode === "multi") choisies = rep[step];
    else choisies = rep.q5.changed === true ? ["yes"] : rep.q5.changed === false ? ["no"] : [];

    dim = grisees(q, choisies);

    if (!reconstruire) {
      // mise à jour en place : classes + aria seulement
      var noeuds = elList.querySelectorAll(".opt");
      for (i = 0; i < noeuds.length; i++) {
        var n = noeuds[i];
        var v = n.getAttribute("data-v");
        var estSym = n.getAttribute("data-sym") === "1";
        var sel = estSym ? rep.q5.symptoms.indexOf(v) !== -1 : choisies.indexOf(v) !== -1;
        n.classList.toggle("sel", sel);
        n.classList.toggle("dim", !estSym && !!dim[v]);
        n.setAttribute("aria-pressed", sel ? "true" : "false");
      }
      var rev = elList.querySelector(".reveal");
      if (rev) rev.classList.toggle("open", rep.q5.changed === true);
      return;
    }

    for (i = 0; i < q.options.length; i++) {
      html += htmlOption(q.options[i], choisies.indexOf(q.options[i].value) !== -1,
                         !!dim[q.options[i].value], q.mode === "gate", 0.16 + i * 0.04, false);
    }
    if (q.mode === "gate") {
      var ouvert = rep.q5.changed === true;
      html += '<div class="reveal' + (ouvert ? " open" : "") + '"><div class="sub">' + esc(q.revealTitle) + '</div>';
      for (i = 0; i < q.revealOptions.length; i++) {
        html += htmlOption(q.revealOptions[i], rep.q5.symptoms.indexOf(q.revealOptions[i].value) !== -1,
                           false, false, null, true);
      }
      html += '</div>';
    }
    elList.innerHTML = html;
    elList.className = "list" + (q.grid ? " grid2" : "");
  }

  function rendrePied() {
    var step = ORDRE[iEtape];
    var q = QUESTIONS[step];
    if (q.maxSelect !== undefined) {
      elCounter.style.display = "";
      elCounter.innerHTML = "<b>" + selectionMulti(step).length + "</b>/" + q.maxSelect + " selected";
    } else {
      elCounter.style.display = "none";
    }
    elCta.disabled = !etapeValide(step, rep);
    elCta.innerHTML = esc(q.ctaLabel || "Continue") + ARROW_IC;
  }

  function rendre() {
    var q = QUESTIONS[ORDRE[iEtape]];
    var pct = Math.round((q.index / TOTAL) * 100);

    elProg.innerHTML = '<div class="prog-fill" style="--pw:' + pct + '%"></div>';
    elProg.setAttribute("aria-valuenow", q.index);
    elProg.setAttribute("aria-label", "Step " + q.index + " of " + TOTAL);
    elStep.textContent = pad2(q.index) + " / " + pad2(TOTAL);

    elHead.innerHTML = '<h1 class="question">' + esc(q.title) + '</h1>'
      + '<p class="helper">' + HELPER_IC + '<span>' + q.helperHtml + '</span></p>';

    rendreListe(true);
    rendrePied();

    rejouer(elHead, ".12s");
    rejouer(elFooter, ".5s");
    elList.scrollTop = 0;
  }

  /* ═══ INTERACTIONS ═══ */

  elList.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".opt") : null;
    if (!btn || !elList.contains(btn)) return;
    var valeur = btn.getAttribute("data-v");
    var step = ORDRE[iEtape];
    var q = QUESTIONS[step];

    if (btn.getAttribute("data-sym") === "1") {
      rep.q5.symptoms = basculer(rep.q5.symptoms, valeur, false, undefined);
    } else if (q.mode === "age") {
      rep.age = valeur;
    } else if (q.mode === "single") {
      rep[step] = valeur;
    } else if (q.mode === "multi") {
      var exclusive = false, i;
      for (i = 0; i < q.options.length; i++) {
        if (q.options[i].value === valeur) { exclusive = !!q.options[i].exclusive; break; }
      }
      rep[step] = basculer(rep[step], valeur, exclusive, q.maxSelect);
    } else { // gate
      var change = valeur === "yes";
      rep.q5 = { changed: change, symptoms: change ? rep.q5.symptoms : [] };
    }

    sauver();
    rendreListe(false);
    rendrePied();
  });

  elCta.addEventListener("click", function () {
    if (!etapeValide(ORDRE[iEtape], rep)) return;
    sauver();
    if (iEtape >= TOTAL - 1) { location.href = SUIVANT; return; }
    iEtape += 1;
    rendre();
  });

  /* Retour : 1ʳᵉ étape → sortie du questionnaire (accueil du proto). */
  document.getElementById("q-back").addEventListener("click", function () {
    if (iEtape === 0) { if (history.length > 1) history.back(); else location.href = "index.html"; return; }
    iEtape -= 1;
    rendre();
  });

  /* ═══ DÉMARRAGE ═══ */
  if (charger()) iEtape = etapeReprise();
  rendre();
})();
</script>
</body>
</html>
