<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SmartSkin AI</title>
<style>html{background:#F1F3F6}</style>
</head>
<body>
<script>
(function () {
  "use strict";
  /* Aiguillage A/B du paywall — pendant V2 du PaywallSwitch V1 (flag PostHog
     `different-paywall-page`). A = 16-paywall-a (clair glassmorphique),
     B = 16-paywall-b (sombre immersif). Affectation 50/50 PERSISTÉE en
     localStorage (une personne garde sa variante), surcharge ?v=a|b pour la QA.
     À brancher sur PostHog pour piloter la répartition sans redéployer.
     Cette page reste LA porte d'entrée : tous les `next=paywall` du tunnel
     reviennent ici et sont redistribués vers la même variante. */
  var CLE = "ss-paywall-ab";
  var q = new URLSearchParams(location.search);
  var v = q.get("v");
  if (v !== "a" && v !== "b") {
    try { v = localStorage.getItem(CLE); } catch (e) { v = null; }
    if (v !== "a" && v !== "b") v = Math.random() < 0.5 ? "a" : "b";
  }
  try { localStorage.setItem(CLE, v); } catch (e) {}
  location.replace("16-paywall-" + v + ".html");
})();
</script>
</body>
</html>
